name: CI for Flutter & Python App

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest

    - name: Run Flake8 for Python Linting
      run: |
        pip install flake8
        flake8 backend/

    - name: Run Backend Unit Tests
      run: pytest backend/tests

  flutter-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'  # Change this if you're using a different version

    - name: Install dependencies
      run: flutter pub get
      working-directory: frontend  # Set this to the correct path where `pubspec.yaml` exists

    - name: Analyze Dart Code
      run: flutter analyze
      working-directory: frontend

    - name: Run Flutter Tests
      run: flutter test
      working-directory: frontend
